# Configuration used by example 4, which registers two hook points ("pre-physics" and
# "post-physics") on top of the implicit "default" one. See README.md in this directory for a
# detailed description of hook points and of how they relate to read-only and writable parameters.
#
# PluginHooks declares nothing in its negotiate(): everything is requested from here.
#
# The table below is what this configuration asks for. Each of the three parameters is used at
# both hook points, with an access mode that depends on the hook point:
#
#   parameter    | pre-physics | post-physics
#   -------------+-------------+-------------
#   step         | read-only   | read-only
#   forcing      | WRITABLE    | read-only
#   temperature  | read-only   | WRITABLE

# Write-back is disabled by default: without this key, a plugin requesting a writable parameter is
# rejected during negotiation. See src/plume/coupling/README.md for the available policies.
write-back-policy: single-writer

plugins:
  - name: PluginHooks
    lib: plugin_hooks

    # Hook points the plugin is run at. This list *replaces* the hook points that the plugin
    # declares in its negotiate() (if any). Each of them must be registered by the model
    # (Protocol::offerHook), otherwise the plugin is rejected.
    hooks: [pre-physics, post-physics]

    parameters:
      -
        # "hooks": the hook points at which the plugin needs the parameter (its hook scope). They
        #          must be among the hook points of the plugin. When the key is absent, the parameter
        #          is needed at every hook point of the plugin - so the "hooks" keys below could all
        #          be omitted; they are spelled out for clarity.
        #
        # "writable": absent or false -> read-only at every hook point of its scope
        #             true            -> writable at every hook point of its scope
        #             [hook, ...]     -> writable at the listed hook points, read-only at the
        #                                other hook points of its scope

        # read-only at both hook points
        - name: step
          type: int
          hooks: [pre-physics, post-physics]

        # written at "pre-physics", read-only at "post-physics"
        - name: forcing
          type: double
          hooks: [pre-physics, post-physics]
          writable: [pre-physics]

        # read-only at "pre-physics", written at "post-physics"
        - name: temperature
          type: double
          hooks: [pre-physics, post-physics]
          writable: [post-physics]

        # The same access can also be requested by listing a parameter once per hook point; the
        # entries are merged hook point by hook point ("writable wins"). For "temperature":
        #
        # - name: temperature
        #   type: double
        #   hooks: [pre-physics]
        # - name: temperature
        #   type: double
        #   hooks: [post-physics]
        #   writable: true

    core-config: {}
